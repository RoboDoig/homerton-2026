### Reactive operators

![Operator categories](../../images/categories-simple.svg)

Note:
Four broad families. The appendix has one diagram per operator.

---

###### Zip

![Zip](../../images/zip.svg)

Note:
Pairs values one-for-one, waiting for both. This is the operator people reach
for when they mean synchronisation.

---

###### CombineLatest

![CombineLatest](../../images/combinelatest.svg)

Note:
Emits on *either* input, pairing with the most recent value of the other.

---

###### WithLatestFrom

![WithLatestFrom](../../images/withlatestfrom.svg)

Note:
Asymmetric — only the left stream drives output. Usually what you actually
want in a closed-loop rig.

### Hot vs cold

![Temperature](../../images/temperature.svg)

Note:
Cold: each subscriber gets its own private sequence. Hot: everyone shares one.
This is the single most common source of "why is my camera opening twice?"

### Introduction to Harp

![Harp-Bonsai](../../images/bonsai-harp.svg)

[harp-tech.org](https://harp-tech.org/)

Note:
This is where the Harp talk begins — folded into the end of this deck rather
than being a separate session.

---

### Synchronisation is hard

* Different devices operate on isolated clocks
* We can synchronise by passing 'markers' between devices
* The difficulty of interpreting these markers scales supralinearly with number of devices

---

### What Harp does about it

* Shares a clock signal between devices
* Explicitly attaches timestamps to samples
* Reports events asynchronously

---

### Harp is open source

* The devices, the protocol, and the firmware
* You can build your own device on the protocol
* It then synchronises natively with every other Harp device
