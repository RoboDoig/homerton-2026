### What is Bonsai?

A visual language for building reactive data-processing pipelines.

* Nodes are **operators**
* Edges are **streams of data**
* A workflow describes *what* happens to each value, not *when*

--

### Why streams?

Experiments are made of asynchronous sources: cameras, microphones,
sensors, timers. A stream is a uniform way to talk about all of them.
